services:
  # CPU only: no GPU devices are passed through to this container.
  triage:
    build: .
    ports:
      - "8000:8000"
    environment:
      MODEL: ${MODEL:-qwen2.5:0.5b}
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - triage-data:/data
      - ./logs:/app/logs

volumes:
  triage-data:
